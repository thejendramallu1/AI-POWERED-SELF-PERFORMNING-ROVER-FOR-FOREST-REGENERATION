services:
  - type: web
    name: ai-rover-dashboard
    runtime: python
    plan: free
    rootDir: AI rover project
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

  - type: web
    name: ai-rover-links
    runtime: static
    buildCommand: mkdir -p dist && cp index.html dist/index.html
    staticPublishPath: dist
